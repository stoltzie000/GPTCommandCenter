name: PostgreSQL certification

on:
  push:
    branches: [main]
  pull_request:

jobs:
  postgres-certification:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gptcc_test
          POSTGRES_PASSWORD: gptcc_test
          POSTGRES_DB: gptcc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U gptcc_test -d gptcc_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Create isolated certification databases
        env:
          PGPASSWORD: gptcc_test
        run: |
          createdb -h 127.0.0.1 -U gptcc_test gptcc_incomplete
          createdb -h 127.0.0.1 -U gptcc_test gptcc_restore
          for migration in db/migrations/00[1-7]_*.sql; do
            psql -h 127.0.0.1 -U gptcc_test -d gptcc_incomplete -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Certify PostgreSQL migrations, persistence, and integration
        env:
          PG_TEST_URL: postgresql://gptcc_test:gptcc_test@127.0.0.1:5432/gptcc_test
          PG_CERT_INCOMPLETE_URL: postgresql://gptcc_test:gptcc_test@127.0.0.1:5432/gptcc_incomplete
          PG_CERT_RESTORE_URL: postgresql://gptcc_test:gptcc_test@127.0.0.1:5432/gptcc_restore
          PG_CERT_DUMP_FILE: ${{ runner.temp }}/gptcc-task24.dump
        run: npm run test:postgres-certify

  browser-certification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install Chromium for mandatory browser certification
        run: npx playwright install --with-deps chromium
      - name: Run mandatory MVP browser certification
        run: npm run test:browser-certify
